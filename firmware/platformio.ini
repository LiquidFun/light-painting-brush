; Light Painting Stick firmware.
;
; Default env is the real firmware. `m1_selftest` builds only the hardcoded
; rainbow sweep with no BLE, which is what separates "my wiring is wrong" from
; "my BLE code is wrong" (REQUIREMENTS §5, M1). Do not skip it.
;
;   pio run -e esp32dev -t upload      # firmware
;   pio run -e m1_selftest -t upload   # wiring / colour order / power check
;   pio device monitor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
lib_deps =
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^1.4.2
build_src_filter = +<*> -<selftest_rainbow.cpp>

[env:m1_selftest]
lib_deps =
    fastled/FastLED@^3.7.0
build_src_filter = +<selftest_rainbow.cpp>
