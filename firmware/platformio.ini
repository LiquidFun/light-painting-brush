; Light Painting Stick firmware.
;
; Default env is the WiFi firmware: it dials out to the relay described in
; PROTOCOL.md. `esp32dev_ble` builds the v1 Bluetooth firmware instead and exists
; only until the WiFi path has been flashed and proven on hardware
; (REQUIREMENTS §7, M4) — after that it goes.
;
; `m1_selftest` builds only the hardcoded rainbow sweep with no networking at all,
; which is what separates "my wiring is wrong" from "my network code is wrong".
; Do not skip it.
;
;   cp src/secrets.example.h src/secrets.h   # then fill it in
;   pio run -e esp32dev -t upload            # WiFi firmware
;   pio run -e esp32dev_ble -t upload        # legacy BLE firmware
;   pio run -e m1_selftest -t upload         # wiring / colour order / power check
;   pio device monitor
;
; The serial monitor holds /dev/ttyUSB* exclusively, so upload fails while it is
; open.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
; Add -DDEBUG_ESP_PORT=Serial to make arduinoWebSockets log the handshake
; itself — the HTTP status line it gets back distinguishes a TLS failure from a
; 401 from a wrong path. Noisy, so it is not on by default.
build_flags = ${env.build_flags} -DLS_USE_WIFI=1
lib_deps =
    fastled/FastLED@^3.7.0
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
build_src_filter = +<*> -<selftest_rainbow.cpp> -<ble_service.cpp>

[env:esp32dev_ble]
build_flags = ${env.build_flags} -DLS_USE_WIFI=0
lib_deps =
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^1.4.2
build_src_filter = +<*> -<selftest_rainbow.cpp> -<net.cpp>

[env:m1_selftest]
lib_deps =
    fastled/FastLED@^3.7.0
build_src_filter = +<selftest_rainbow.cpp>
