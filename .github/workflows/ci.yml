name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; there is nothing to gain from finishing a
# run whose commit has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `npm run build` runs tsc -b itself, but running it separately means a
      # type error is reported as a type error rather than as a failed build.
      - run: npm run typecheck
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Upload the built SPA
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  server:
    name: server — typecheck and relay smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.18+ is the floor for running TypeScript directly by type stripping,
      # which is how the relay starts in production. Keep this in step with
      # node_major in the ansible playbook.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm run typecheck
        working-directory: server

      # Starts the real server and drives it with a fake device and a fake
      # browser over real WebSockets. It also runs the browser's own parser over
      # the relay's output, which is the only automated check that the two halves
      # of PROTOCOL.md agree — so it needs web/ checked out, not built.
      - run: npm run smoke
        working-directory: server
